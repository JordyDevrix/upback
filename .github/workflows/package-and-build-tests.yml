name: Frontend Backend CI Tests

on: [pull_request, workflow_dispatch]

jobs:
  frontend:
    runs-on: ubuntu-latest
    outputs:
      build-artifact: ${{ steps.upload.outputs.artifact-path }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: |
          cd src/frontend/upback-frontend
          npm ci
          npm run build
      - name: Upload frontend build
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: src/frontend/upback-frontend/dist

  backend:
    runs-on: ubuntu-latest
    needs: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH
      - name: Install dependencies
        run: uv sync
      - name: Download frontend build
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: src/frontend/upback-frontend/dist
      - name: Use frontend build
        run: |
          echo "Frontend build is now available for backend"
          ls src/frontend/upback-frontend/dist
      - name: Run app and check
        run: |
          uv run upback --port 8085 &
          APP_PID=$!          # Save process ID
          sleep 5              # Wait a bit for server to start
          curl --fail http://localhost:8085/health
          kill $APP_PID        # Stop server