name: Type Checking

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  type-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install mypy flake8 flake8-annotations

      - name: Check missing type annotations
        run: |
          flake8 src/upback --select=ANN

      - name: Check type correctness
        run: |
          mypy src/upback